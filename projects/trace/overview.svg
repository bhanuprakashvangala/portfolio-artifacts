<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Autonomous experimentation</title><desc id="desc">Planning, instrument execution, and measurement form a closed loop</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2774a5"/></marker></defs>
<rect x="1" y="1" width="718" height="428" rx="8" fill="#fff" stroke="#e0e6ea"/>
<text x="32" y="41" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73838e">AUTONOMOUS EXPERIMENTATION</text>
<rect x="250" y="75" width="220" height="66" rx="5" fill="#eaf3fa" stroke="#9aafbd" stroke-width="2"/>
<text x="360.0" y="115.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Plan experiment</text>
<rect x="467" y="205" width="205" height="69" rx="5" fill="#f3f7f9" stroke="#9aafbd" stroke-width="2"/>
<text x="569.5" y="246.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Run instrument</text>
<rect x="255" y="307" width="220" height="60" rx="5" fill="#edf5f4" stroke="#9aafbd" stroke-width="2"/>
<text x="365.0" y="344.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Measurements</text>
<rect x="45" y="203" width="185" height="69" rx="5" fill="#f3f7f9" stroke="#9aafbd" stroke-width="2"/>
<text x="137.5" y="244.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Record results</text>
<polyline points="471,108 570,108 570,195" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="570,275 570,337 485,337" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="253,337 137,337 137,282" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="137,201 137,108 240,108" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="359" cy="235" r="47" fill="#f2f5f7"/>
<text x="359" y="231" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#263b4a">Provenance</text>
<text x="359" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#73838e">every step</text>
<text x="360" y="403" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#73838e">Plan → execute → measure → refine</text>
</svg>