<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Evidence-based question answering</title><desc id="desc">A question retrieves literature to support a response</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2774a5"/></marker></defs>
<rect x="1" y="1" width="718" height="428" rx="8" fill="#fff" stroke="#e0e6ea"/>
<text x="32" y="41" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73838e">EVIDENCE-BASED QUESTION ANSWERING</text>
<rect x="38" y="85" width="188" height="66" rx="5" fill="#fff" stroke="#9aafbd" stroke-width="2"/>
<text x="132.0" y="125.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Question</text>
<polyline points="226,118 287,118" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="163" height="66" rx="5" fill="#eaf3fa" stroke="#9aafbd" stroke-width="2"/>
<text x="381.5" y="125.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Retrieve</text>
<polyline points="465,118 535,118" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="550" y="71" width="100" height="112" rx="5" fill="#fff" stroke="#9aafbd" stroke-width="2"/>
<polyline points="566,95 624,95" fill="none" stroke="#73838e" stroke-width="2" stroke-linejoin="round"/>
<polyline points="566,113 630,113" fill="none" stroke="#73838e" stroke-width="2" stroke-linejoin="round"/>
<polyline points="566,131 613,131" fill="none" stroke="#73838e" stroke-width="2" stroke-linejoin="round"/>
<text x="600" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#263b4a">Literature</text>
<polyline points="600,184 600,247 470,247" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="286" y="207" width="178" height="86" rx="5" fill="#edf5f4" stroke="#9aafbd" stroke-width="2"/>
<text x="375.0" y="257.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Generate answer</text>
<polyline points="284,250 232,250" fill="none" stroke="#2774a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="215" width="182" height="68" rx="5" fill="#fff" stroke="#9aafbd" stroke-width="2"/>
<text x="131.0" y="256.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263b4a">Cited response</text>
<text x="391" y="330" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73838e">retrieved evidence accompanies the query</text>
<text x="360" y="403" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#73838e">Question + source context → grounded response</text>
</svg>