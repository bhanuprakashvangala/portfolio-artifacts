# Copy to repository root .github/workflows/data-audit-studio.yml to enable CI.
name: Data Audit Studio tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r data-audit-studio/requirements.txt
      - run: cd data-audit-studio && python -m pytest -q
